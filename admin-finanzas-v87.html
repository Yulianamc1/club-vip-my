<script>
(()=>{'use strict';
const SUPABASE_URL='https://ncdppxdkxfduypvscexy.supabase.co';
const SUPABASE_KEY='sb_publishable_eDOs8qIBNohDID0Co6kK9w_Yaufm5yS';
const BUCKET='finanzas-documentos';
const today=()=>new Date().toISOString().slice(0,10), currentMonth=()=>today().slice(0,7);
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Math.max(0,Number(v)||0), monthOf=d=>String(d||'').slice(0,7), fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-MX'):'', monthName=m=>new Date(m+'-01T12:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'});
const cleanName=s=>String(s||'archivo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').slice(0,90);
let sb,user,movements=[],payments=[],members=[],closures=[],modalSaveHandler=null;
let state={tab:'resumen',month:currentMonth(),showArchived:false};
const tabs=[['resumen','🏠 Lo principal'],['ingresos','💰 Dinero que entró'],['servicios','🤝 Trabajos privados'],['gastos','💳 Dinero que gasté'],['facturas','🧾 Facturas que me dieron'],['cierre','📦 Cerrar y descargar mes']];
function gateMessage(title,text,showButton=true){document.getElementById('gateTitle').textContent=title;document.getElementById('gateText').textContent=text;document.getElementById('spinner').classList.add('hidden');document.getElementById('gateActions').innerHTML=showButton?'<button class="btn primary" onclick="location.reload()">Volver a intentar</button>':''}
function friendlyError(err){const m=String(err?.message||err||'Error desconocido');if(/relation .* does not exist|schema cache/i.test(m))return 'La base financiera todavía no está activada en Supabase.';if(/row-level security|permission denied|not authorized/i.test(m))return 'Tu sesión no tiene permiso de administradora o necesita volver a iniciar sesión.';if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'No hay conexión. Revisa tu internet y vuelve a intentar.';return m}
async function importTransferredSession(){const p=new URLSearchParams(location.hash.replace(/^#/,'')),a=p.get('vip_access_token'),r=p.get('vip_refresh_token');if(a&&r){const res=await sb.auth.setSession({access_token:a,refresh_token:r});if(res.error)throw res.error;history.replaceState(null,'',location.pathname+location.search)}}
async function boot(){try{if(!window.supabase?.createClient)throw new Error('No se pudo cargar la conexión segura.');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});await importTransferredSession();const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session){gateMessage('Primero inicia sesión','Abre la plataforma, entra al Centro de Control como administradora y vuelve a abrir esta sección.');return}user=session.user;let allowed=false;try{const {data,error:rpcErr}=await sb.rpc('es_admin');allowed=!rpcErr&&data===true}catch(_){allowed=false}if(!allowed){try{const {data}=await sb.from('perfiles').select('rol').eq('id',user.id).maybeSingle();allowed=!!data&&data.rol==='admin'}catch(_){}}if(!allowed){gateMessage('Esta sección es privada','Administración y Finanzas solo se abre con la cuenta principal de administradora.');return}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');bindShell();await loadAll()}catch(err){gateMessage('No pude abrir la administración',friendlyError(err))}}
function bindShell(){document.getElementById('backBtn').onclick=()=>{const u=new URLSearchParams(location.search).get('vip_return');if(u)location.href=u;else if(history.length>1)history.back();else location.href='./'};document.getElementById('reloadBtn').onclick=loadAll;document.getElementById('modalX').onclick=closeModal;document.getElementById('modalCancel').onclick=closeModal;document.getElementById('modalSave').onclick=()=>modalSaveHandler&&modalSaveHandler();document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render()});document.getElementById('content').addEventListener('click',handleClick);document.getElementById('content').addEventListener('change',handleChange)}
async function loadAll(){setSync('Actualizando…',false);try{const [m1,m2,m3,m4]=await Promise.all([sb.from('vip_finanzas_movimientos').select('*').order('fecha',{ascending:false}),sb.from('vip_pago_movimientos').select('*').order('fecha_pago',{ascending:false}),sb.from('miembros').select('id,nombre,correo,plan,estado,fecha_inicio,fecha_vencimiento').order('id',{ascending:false}),sb.from('vip_finanzas_cierres').select('*').order('periodo_mes',{ascending:false})]);for(const r of [m1,m2,m3,m4])if(r.error)throw r.error;movements=m1.data||[];payments=m2.data||[];members=m3.data||[];closures=m4.data||[];setSync('Datos actualizados',true);render()}catch(err){setSync('No se pudo actualizar',false);document.getElementById('content').innerHTML='<div class="errorbox"><b>No pude cargar los datos.</b><br>'+esc(friendlyError(err))+'</div>'}}
function setSync(text,ok){const e=document.getElementById('syncText');if(e)e.textContent=text;const d=document.querySelector('.dot');if(d)d.style.background=ok?'var(--green)':'var(--orange)'}
function validPayment(p){const s=String(p.estado||'').toLowerCase();return num(p.monto)>0&&!/cancel|rechaz|devuel|fall/.test(s)}function paymentDate(p){return p.fecha_pago||String(p.creado_en||'').slice(0,10)}function aliveMovement(x){return !x.eliminado_en&&(state.showArchived||!x.archivado)}function memberName(id){const m=members.find(x=>String(x.id)===String(id));return m?.nombre||`Miembro #${id||''}`}
function activeMembers(){const t=today();return members.filter(m=>{const s=String(m.estado||'activo').toLowerCase();return !/venc|suspend|cancel|inactiv/.test(s)&&(!m.fecha_vencimiento||m.fecha_vencimiento>=t)})}
function monthData(){const fin=movements.filter(x=>aliveMovement(x)&&monthOf(x.fecha)===state.month),subs=payments.filter(p=>validPayment(p)&&monthOf(paymentDate(p))===state.month),ingresos=fin.filter(x=>x.tipo==='ingreso'&&x.estado!=='cancelado'),egresos=fin.filter(x=>x.tipo==='egreso'&&x.estado!=='cancelado'),subscriptions=subs.reduce((a,x)=>a+num(x.monto),0),extraIncome=ingresos.reduce((a,x)=>a+num(x.monto_pagado),0),expenses=egresos.reduce((a,x)=>a+num(x.monto_pagado||x.monto_total),0),pending=movements.filter(x=>aliveMovement(x)&&x.tipo==='ingreso'&&x.estado!=='cancelado').reduce((a,x)=>a+Math.max(0,num(x.monto_total)-num(x.monto_pagado)),0),invoiceVat=egresos.filter(x=>x.factura_estado==='recibida').reduce((a,x)=>a+num(x.factura_iva),0);return{fin,subs,ingresos,egresos,subscriptions,extraIncome,expenses,pending,invoiceVat,totalIncome:subscriptions+extraIncome,profit:subscriptions+extraIncome-expenses}}
function currentClosure(){return closures.find(x=>monthOf(x.periodo_mes)===state.month)}function monthLocked(){const c=currentClosure();return c&&['cerrado','archivado'].includes(String(c.estado||''))}
function filterBar(){return `<div class="filters no-print"><div class="field"><label>Mes que estás revisando</label><input id="monthFilter" type="month" value="${esc(state.month)}"><div class="help">Todas las cuentas se actualizan con este mes.</div></div><div class="field"><label>Registros archivados</label><select id="archiveFilter"><option value="no" ${!state.showArchived?'selected':''}>Ocultarlos</option><option value="si" ${state.showArchived?'selected':''}>También mostrarlos</option></select><div class="help">Archivar no borra nada.</div></div><button class="btn" data-action="current-month">Ir al mes actual</button></div>`}
function metric(label,value,detail,cls=''){const k=label.toLowerCase(),icon=k.includes('entró')||k.includes('ingreso')?'💰':k.includes('gast')?'🛍️':k.includes('quedó')||k.includes('resultado')?'✨':k.includes('deben')||k.includes('pendiente')?'⏳':k.includes('iva')?'🧾':'📌';return `<section class="card metric"><div class="icon">${icon}</div><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div><small>${esc(detail)}</small></section>`}

function planStats(){const active=activeMembers(),monthly=payments.filter(p=>validPayment(p)&&monthOf(paymentDate(p))===state.month),plans=['Básico','VIP','VIP Pro'];return `<div class="grid two"><section class="card"><div class="section-title"><div><h3>Miembros activos por plan</h3><p>Estado actual de la plataforma.</p></div></div>${plans.map(p=>`<div class="plan-row"><span>${esc(p)}</span><b>${active.filter(x=>String(x.plan||'')===p).length}</b></div>`).join('')}<div class="plan-row"><strong>Total activo</strong><b>${active.length}</b></div></section><section class="card"><div class="section-title"><div><h3>Suscripciones pagadas del mes</h3><p>Importes registrados por la sección de pagos.</p></div></div>${plans.map(p=>{const rows=monthly.filter(x=>String(x.plan||'')===p);return `<div class="plan-row"><span>${esc(p)} · ${rows.length} pago(s)</span><b>${money(rows.reduce((a,x)=>a+num(x.monto),0))}</b></div>`}).join('')}<div class="plan-row"><strong>Total</strong><b>${money(monthly.reduce((a,x)=>a+num(x.monto),0))}</b></div></section></div>`}

function openModal(title,body,saveLabel,handler){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalSave').textContent=saveLabel||'Guardar';modalSaveHandler=handler;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open');modalSaveHandler=null}function getVal(id){return document.getElementById(id)?.value||''}function checked(id){return !!document.getElementById(id)?.checked}
function openMovement(kind,id){if(monthLocked()){toast('Este mes está cerrado. Reábrelo para registrar cambios.');return}const x=id?movements.find(v=>String(v.id)===String(id)):null,isExpense=kind==='expense',isService=kind==='service',title=x?'Editar registro':isExpense?'Registrar gasto':isService?'Registrar trabajo privado':'Registrar ingreso';const categories=isExpense?['Publicidad Meta','Canva / plataformas','Materiales','Envíos','Comisiones','Equipo / mantenimiento','Servicios','Impuestos','Otro gasto']:isService?['Diseño personalizado','Asesoría privada','Plan mensual de contenido','Campaña publicitaria','Plantilla personalizada','Otro servicio']:['Plantilla de temporada','Kit digital','Producto físico','Asesoría','Curso / clase','Otro ingreso'];const total=x?.monto_total??'',paid=x?.monto_pagado??(isExpense?'':'');openModal(title,`<div class="formgrid"><div class="field"><label>Fecha</label><input id="fDate" type="date" value="${esc(x?.fecha||today())}"></div><div class="field"><label>${isExpense?'Tipo de gasto':'Tipo de venta o trabajo'}</label><select id="fCategory">${categories.map(c=>`<option ${x?.categoria===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field full"><label>${isExpense?'¿Qué pagaste?':'¿Qué vendiste o qué trabajo harás?'}</label><input id="fConcept" value="${esc(x?.concepto||'')}" placeholder="${isExpense?'Ej. Campaña de Meta para cajitas':'Ej. Kit de etiquetas escolares'}"></div><div class="field full"><label>${isExpense?'¿A quién le pagaste?':'Nombre del cliente (opcional)'}</label><input id="fParty" value="${esc(x?.cliente_proveedor||'')}" placeholder="${isExpense?'Ej. Meta, Canva o Papelería López':'Ej. María González'}"></div><div class="field"><label>${isExpense?'Total que pagaste':'Precio total'}</label><input id="fTotal" type="number" min="0" step="0.01" value="${esc(total)}" placeholder="0.00"></div><div class="field"><label>${isExpense?'Cantidad pagada':'Cuánto te han pagado'}</label><input id="fPaid" type="number" min="0" step="0.01" value="${esc(paid)}" placeholder="0.00"><div class="help">${isExpense?'Normalmente es igual al total.':'Sirve para calcular cuánto te deben.'}</div></div><div class="field"><label>Forma de pago</label><select id="fMethod">${['Transferencia','Depósito en efectivo','Mercado Pago','PayPal','Tarjeta','Efectivo','Otro'].map(c=>`<option ${x?.metodo_pago===c?'selected':''}>${c}</option>`).join('')}</select></div>${isService?`<div class="field"><label>Fecha de entrega</label><input id="fDelivery" type="date" value="${esc(x?.fecha_entrega||'')}"></div><div class="field full"><label><input id="fDelivered" type="checkbox" ${x?.entregado?'checked':''}> Ya lo entregué</label></div>`:''}${isExpense?`<div class="field full"><label>¿Qué pasó con la factura?</label><select id="fInvoiceState"><option value="sin_factura" ${x?.factura_estado==='sin_factura'?'selected':''}>No tengo factura</option><option value="por_pedir" ${x?.factura_estado==='por_pedir'?'selected':''}>Me falta pedirla</option><option value="recibida" ${x?.factura_estado==='recibida'?'selected':''}>Ya me la dieron</option><option value="no_aplica" ${x?.factura_estado==='no_aplica'?'selected':''}>No aplica</option></select></div>`:''}<div class="field full"><label>Nota (opcional)</label><textarea id="fNotes">${esc(x?.observaciones||'')}</textarea></div></div>`,'Guardar',async()=>{const concept=getVal('fConcept').trim(),total=num(getVal('fTotal')),paid=Math.min(total,num(getVal('fPaid')||getVal('fTotal')));if(!concept){toast('Escribe qué pasó');return}if(total<=0){toast('Escribe una cantidad mayor a cero');return}const status=paid<=0?'pendiente':paid<total?'parcial':'pagado',payload={fecha:getVal('fDate')||today(),tipo:isExpense?'egreso':'ingreso',origen:isExpense?'gasto':isService?'servicio_privado':'ingreso_extra',categoria:getVal('fCategory'),concepto:concept,cliente_proveedor:getVal('fParty').trim(),monto_total:total,monto_pagado:paid,metodo_pago:getVal('fMethod'),estado:status,obse function openInvoice(id){if(monthLocked()){toast('Este mes está cerrado. Reábrelo para registrar cambios.');return}const x=movements.find(v=>String(v.id)===String(id));if(!x)return;openModal('Factura que me dieron',`<div class="note" style="margin-bottom:12px">Aquí guardas la factura de <b>${esc(x.concepto)}</b>. No estás emitiendo una factura.</div><div class="formgrid"><div class="field full"><label>Estado</label><select id="iState"><option value="sin_factura" ${x.factura_estado==='sin_factura'?'selected':''}>No tengo factura</option><option value="por_pedir" ${x.factura_estado==='por_pedir'?'selected':''}>Me falta pedirla</option><option value="recibida" ${x.factura_estado==='recibida'?'selected':''}>Ya me la dieron</option><option value="no_aplica" ${x.factura_estado==='no_aplica'?'selected':''}>No aplica</option></select></div><div class="field full"><label>Folio fiscal / UUID</label><input id="iUuid" value="${esc(x.factura_uuid||'')}"></div><div class="field"><label>Subtotal</label><input id="iSubtotal" type="number" min="0" step="0.01" value="${esc(x.factura_subtotal||'')}"></div><div class="field"><label>IVA</label><input id="iVat" type="number" min="0" step="0.01" value="${esc(x.factura_iva||'')}"></div><div class="field"><label>Total factura</label><input id="iTotal" type="number" min="0" step="0.01" value="${esc(x.factura_total||'')}"></div><div class="field"><label>Archivo XML</label><input id="iXml" type="file" accept=".xml,text/xml,application/xml"></div><div class="field"><label>Archivo PDF</label><input id="iPdf" type="file" accept=".pdf,application/pdf"></div><div class="field full"><label><input id="iBusiness" type="checkbox" ${x.relacionado_negocio?'checked':''}> Está relacionada con el negocio</label></div><div class="field full"><label><input id="iVatPossible" type="checkbox" ${x.posible_iva_acreditable?'checked':''}> Marcar para revisar el IVA con mi contadora</label></div><div class="field full"><label><input id="iReviewed" type="checkbox" ${x function exportMonth(){const sheets={Suscripciones:subscriptionRows(),Ingresos:financeRows('ingreso').filter(x=>x.Origen!=='servicio_privado'),Servicios:financeRows('ingreso').filter(x=>x.Origen==='servicio_privado'),Gastos:financeRows('egreso'),Facturas:invoiceRows()};if(window.XLSX){const wb=XLSX.utils.book_new();Object.entries(sheets).forEach(([name,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{Sin_registros:'Sin registros'}]),name.slice(0,31)));XLSX.writeFile(wb,`administracion-finanzas-${state.month}.xlsx`);toast('Excel descargado')}else{const rows=[['Sección','Fecha','Concepto','Total']];Object.entries(sheets).forEach(([name,list])=>list.forEach(x=>rows.push([name,x.Fecha||'',x.Concepto||x.Tipo||'',x.Total||x.Monto||''])));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`administracion-finanzas-${state.month}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('CSV descargado')}}
function handleChange(e){if(e.target.id==='monthFilter'){state.month=e.target.value||currentMonth();render()}if(e.target.id==='archiveFilter'){state.showArchived=e.target.value==='si';render()}}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='current-month'){state.month=currentMonth();render()}else if(a==='new-income')openMovement('income');else if(a==='new-service')openMovement('service');else if(a==='new-expense')openMovement('expense');else if(a==='edit-movement')openMovement(b.dataset.kind,b.dataset.id);else if(a==='invoice')openInvoice(b.dataset.id);else if(a==='toggle-archive')toggleArchive(b.dataset.id);else if(a==='void')voidMovement(b.dataset.id);else if(a==='download-file')downloadPrivateFile(b.dataset.path);else if(a==='export-month')exportMonth();else if(a==='print')window.print();else if(a==='close-month')saveClosure('cerrado');else if(a==='archive-month')saveClosure('archivado');else if(a==='reopen-month')saveClosure('abierto')}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(window.__financeToast);window.__financeToast=setTimeout(()=>t.classList.remove('show'),2700)}
boot();
})();
</script>
