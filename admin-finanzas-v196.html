<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Administración, Finanzas y SAT · Club VIP MY · V196</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js"></script>
    <script src="finanzas-admin-seguridad-v196.js"></script>
    <style>
      :root {
        --bg: #100a15;
        --bg2: #17101e;
        --panel: #21172a;
        --panel2: #2a1d35;
        --panel3: #342342;
        --line: #4c385d;
        --line2: #604873;
        --text: #f3ebf7;
        --muted: #b9a9c2;
        --gold: #e5c46f;
        --gold2: #f4dda0;
        --purple: #7b3ba0;
        --purple2: #a060c0;
        --green: #6fd4a2;
        --red: #ff8f88;
        --orange: #f0b66c;
        --aqua: #70cdd0;
        --pink: #ed85b2;
        --accent: #7b3ba0;
        --accent2: #a060c0;
        --accent-dark: #421b59;
        --accent-rgb: 123, 59, 160;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.26);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Arial,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at 10% 10%,
            rgba(123, 59, 160, 0.2),
            transparent 26%
          ),
          radial-gradient(
            circle at 92% 16%,
            rgba(229, 196, 111, 0.1),
            transparent 22%
          ),
          linear-gradient(145deg, var(--bg), #160d1d 50%, #0e0912);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      .hidden {
        display: none !important;
      }
      button {
        cursor: pointer;
      }
      .loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
      }
      .loading-card {
        width: min(600px, 100%);
        background: linear-gradient(150deg, #291a34, #1b1123);
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 28px;
        text-align: center;
        box-shadow: var(--shadow);
      }
      .loading-card .icon {
        font-size: 52px;
      }
      .loading-card h1 {
        font:
          700 30px/1.1 Georgia,
          serif;
        margin: 8px 0;
        color: var(--gold2);
      }
      .loading-card p {
        color: var(--muted);
        line-height: 1.55;
      }
      .spinner {
        width: 38px;
        height: 38px;
        margin: 18px auto;
        border: 4px solid #4b375a;
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app {
        min-height: 100vh;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: linear-gradient(
          120deg,
          #1c0e28,
          #421b59 48%,
          #5d2878 76%,
          #2c153a
        );
        padding: 14px 18px;
        border-bottom: 1px solid rgba(229, 196, 111, 0.25);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34);
      }
      .toprow {
        max-width: 1440px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .brand h1 {
        font:
          700 24px/1.1 Georgia,
          serif;
        margin: 0;
        color: #fff4d0;
      }
      .brand p {
        margin: 5px 0 0;
        color: #cfbdd8;
        font-size: 13px;
      }
      .top-actions,
      .actions,
      .row-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .statusline {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: #d9cce0;
        font-weight: 800;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
      }
      .btn {
        border: 1px solid var(--line2);
        background: #2a1c35;
        color: var(--text);
        border-radius: 12px;
        padding: 10px 13px;
        font-weight: 850;
        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.15);
        transition: 0.18s;
      }
      .btn:hover {
        transform: translateY(-1px);
        border-color: #8765a0;
      }
      .btn.primary {
        background: linear-gradient(135deg, #61307e, #8c4aac);
        border-color: transparent;
        color: #fff;
      }
      .btn.gold {
        background: linear-gradient(135deg, #f0d78f, #d7ac4b);
        border-color: transparent;
        color: #2b1834;
      }
      .btn.soft {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.19);
      }
      .btn.danger {
        background: #3b1d27;
        border-color: #77414d;
        color: #ffb4ad;
      }
      .btn.small {
        padding: 7px 9px;
        border-radius: 9px;
        font-size: 12px;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none !important;
      }
      .nav {
        position: sticky;
        top: 72px;
        z-index: 35;
        display: flex;
        gap: 8px;
        overflow: auto;
        padding: 10px 16px;
        background: rgba(20, 13, 26, 0.96);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #33253e;
      }
      .nav button {
        white-space: nowrap;
        border: 1px solid #483653;
        background: #21172a;
        color: #cdbfd5;
        border-radius: 999px;
        padding: 9px 13px;
        font-weight: 850;
      }
      .nav button.active {
        background: linear-gradient(135deg, #6e3490, #9a55b8);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 8px 20px rgba(88, 40, 115, 0.35);
      }
      .main {
        max-width: 1440px;
        margin: auto;
        padding: 20px 18px 54px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 15px;
      }
      .page-head h2 {
        font:
          700 27px/1.1 Georgia,
          serif;
        margin: 0;
        color: #f7e8b8;
      }
      .page-head p {
        margin: 6px 0 0;
        color: var(--muted);
        line-height: 1.45;
      }
      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 14px;
        background: #1e1526;
        border: 1px solid #3e2d49;
        border-radius: 17px;
        padding: 13px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 850;
        color: #d7c5df;
        margin: 0 0 5px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid #543e64;
        background: #160f1c;
        color: var(--text);
        border-radius: 11px;
        padding: 10px 11px;
        outline: none;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: #9b69b7;
        box-shadow: 0 0 0 3px rgba(160, 96, 192, 0.14);
      }
      .field textarea {
        min-height: 84px;
        resize: vertical;
      }
      .field input[type="checkbox"] {
        width: auto;
        accent-color: #9f5cbd;
      }
      .help {
        font-size: 11.5px;
        color: #9f90a8;
        margin-top: 5px;
        line-height: 1.4;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .metrics {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .card {
        background: linear-gradient(145deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.13);
      }
      .card.soft-purple {
        background: linear-gradient(145deg, #332044, #25182f);
      }
      .card.soft-gold {
        background: linear-gradient(145deg, #332c22, #251f1d);
      }
      .card.soft-green {
        background: linear-gradient(145deg, #1d332d, #1c2428);
      }
      .metric {
        min-height: 136px;
        position: relative;
        overflow: hidden;
      }
      .metric:after {
        content: "";
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        right: -35px;
        top: -35px;
        background: rgba(255, 255, 255, 0.035);
      }
      .metric .icon {
        display: grid;
        place-items: center;
        width: 39px;
        height: 39px;
        border-radius: 13px;
        background: #432d52;
        font-size: 20px;
      }
      .metric .label {
        color: #c0b1c8;
        font-size: 13px;
        font-weight: 850;
        margin-top: 10px;
      }
      .metric .value {
        font-size: 25px;
        font-weight: 950;
        margin-top: 6px;
        word-break: break-word;
      }
      .metric small {
        display: block;
        color: #9f91a7;
        margin-top: 6px;
        line-height: 1.35;
      }
      .green {
        color: var(--green);
      }
      .red {
        color: var(--red);
      }
      .orange {
        color: var(--orange);
      }
      .goldtext {
        color: var(--gold2);
      }
      .quick-zone {
        margin-bottom: 14px;
        padding: 18px;
        background: linear-gradient(135deg, #2a1736, #51246b 58%, #6d3286);
        border: 1px solid rgba(229, 196, 111, 0.2);
        border-radius: 22px;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.2);
      }
      .quick-title h3 {
        font:
          700 23px Georgia,
          serif;
        margin: 0;
        color: #fff0c3;
      }
      .quick-title p {
        margin: 6px 0 0;
        color: #d6c7dd;
        font-size: 13px;
      }
      .quick-actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .quick-card {
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.065);
        color: #fff;
        border-radius: 16px;
        padding: 13px;
        text-align: left;
      }
      .quick-card:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .quick-card .qicon {
        font-size: 25px;
        display: block;
        margin-bottom: 7px;
      }
      .quick-card b {
        display: block;
        font-size: 14px;
      }
      .quick-card small {
        display: block;
        color: #cbbcd3;
        margin-top: 4px;
        line-height: 1.35;
      }
      .quick-title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
      }
      .quick-title-row > div {
        max-width: 760px;
      }
      .quick-kicker {
        margin: 0 0 7px !important;
        color: #e5c46f !important;
        font-size: 10px !important;
        font-weight: 950;
        letter-spacing: 0.13em;
      }
      .quick-example {
        flex: 0 0 auto;
        border-color: rgba(255, 240, 195, 0.7) !important;
        background: #fff0c3 !important;
        color: #32143f !important;
        font-weight: 900;
      }
      .registration-example-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 11px;
      }
      .registration-example {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.035);
      }
      .registration-example span {
        font-size: 25px;
      }
      .registration-example h4 {
        margin: 8px 0 5px;
      }
      .registration-example p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }
      @media (min-width: 801px) {
        .quick-zone {
          padding: 27px 29px;
        }
        .quick-title h3 {
          font-size: 28px;
        }
        .quick-title p {
          max-width: 760px;
          font-size: 14px;
          line-height: 1.55;
        }
        .quick-actions {
          gap: 14px;
          margin-top: 21px;
        }
        .quick-card {
          min-height: 132px;
          padding: 18px;
        }
        .quick-card .qicon {
          font-size: 31px;
        }
        .quick-card b {
          font-size: 15px;
        }
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 11px;
      }
      .section-title h3 {
        font:
          700 20px Georgia,
          serif;
        margin: 0;
        color: #f4e6b7;
      }
      .section-title p {
        font-size: 13px;
        color: var(--muted);
        margin: 4px 0 0;
      }
      .plan-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 11px 0;
        border-bottom: 1px solid #45334f;
      }
      .plan-row:last-child {
        border-bottom: 0;
      }
      .plan-row b {
        font-size: 20px;
      }
      .note {
        border-left: 4px solid var(--gold);
        background: #2d281f;
        border-radius: 12px;
        padding: 12px 14px;
        color: #eadab5;
        font-size: 13px;
        line-height: 1.5;
      }
      .errorbox {
        background: #351b25;
        border: 1px solid #69404a;
        color: #ffc1bb;
        border-radius: 13px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.45;
      }
      .chart-card {
        display: grid;
        grid-template-columns: minmax(260px, 430px) 1fr;
        gap: 18px;
        align-items: center;
      }
      .chart-wrap {
        position: relative;
        min-height: 310px;
        display: grid;
        place-items: center;
      }
      .chart-wrap canvas {
        width: min(390px, 100%);
        height: 290px;
        max-width: 100%;
      }
      .legend {
        display: grid;
        gap: 9px;
      }
      .legend-row {
        display: grid;
        grid-template-columns: 13px 1fr auto;
        gap: 9px;
        align-items: center;
        padding: 9px 10px;
        border-radius: 12px;
        background: #1a111f;
        border: 1px solid #3f2d49;
      }
      .legend-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .legend-row small {
        color: var(--muted);
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #1b121f;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 1080px;
      }
      th,
      td {
        text-align: left;
        padding: 11px 12px;
        border-bottom: 1px solid #3b2b45;
        font-size: 13px;
        vertical-align: top;
      }
      th {
        background: #281b31;
        color: #d5c4dd;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      tbody tr:hover {
        background: #25182d;
      }
      .empty {
        text-align: center;
        padding: 34px 18px;
        color: var(--muted);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 5px 8px;
        background: #3a2a43;
        font-size: 11px;
        font-weight: 900;
      }
      .badge.ok {
        background: #1f3c32;
        color: #8ee0b7;
      }
      .badge.warn {
        background: #44341f;
        color: #f2c480;
      }
      .badge.bad {
        background: #49262d;
        color: #ffaaa3;
      }
      .badge.gold {
        background: #3c3422;
        color: #f0d488;
      }
      .month-status {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: #392842;
        font-weight: 850;
        font-size: 12px;
      }
      .month-status.closed {
        background: #203b31;
        color: #8ee0b7;
      }
      .month-status.archived {
        background: #3b3323;
        color: #e5cc8a;
      }
      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .promo-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .promo-card {
        background: linear-gradient(145deg, #2c1d37, #211629);
        border: 1px solid #523c61;
        border-radius: 17px;
        padding: 14px;
      }
      .promo-card h4 {
        margin: 0;
        color: #f5e8bb;
      }
      .promo-card p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .promo-card .price {
        font-size: 22px;
        font-weight: 950;
        color: var(--gold2);
      }
      .promo-card .gift {
        margin-top: 9px;
        padding: 9px;
        border-radius: 11px;
        background: #352e20;
        color: #ead7a7;
        font-size: 12px;
      }
      .sat-hero {
        background: linear-gradient(145deg, #172d2a, #221b2d 55%, #35213f);
        border: 1px solid #45675f;
        border-radius: 22px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .sat-hero h3 {
        font:
          700 24px Georgia,
          serif;
        margin: 0;
        color: #c6f2dd;
      }
      .sat-hero p {
        color: #b6d4c8;
        line-height: 1.5;
      }
      .sat-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
        margin-top: 14px;
      }
      .sat-box {
        background: rgba(8, 15, 14, 0.34);
        border: 1px solid rgba(143, 220, 187, 0.2);
        border-radius: 15px;
        padding: 13px;
      }
      .sat-box span {
        display: block;
        color: #a9c8bc;
        font-size: 12px;
        font-weight: 800;
      }
      .sat-box b {
        display: block;
        font-size: 22px;
        margin-top: 7px;
      }
      .progress {
        height: 10px;
        background: #22172a;
        border-radius: 99px;
        overflow: hidden;
        border: 1px solid #483654;
      }
      .progress i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #6dcda0, #e3c36b);
        border-radius: 99px;
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(6, 3, 8, 0.78);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 15px;
      }
      .modal.open {
        display: flex;
      }
      .dialog {
        width: min(860px, 100%);
        max-height: 94vh;
        overflow: auto;
        background: #1d1424;
        border: 1px solid #5b426c;
        border-radius: 22px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(120deg, #321445, #61277c);
        padding: 15px 18px;
      }
      .dialog-head h3 {
        font:
          700 21px Georgia,
          serif;
        margin: 0;
        color: #fff0c3;
      }
      .dialog-body {
        padding: 18px;
      }
      .dialog-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 18px 18px;
      }
      .formgrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .full {
        grid-column: 1/-1;
      }
      .subhead {
        grid-column: 1/-1;
        margin: 6px 0 -2px;
        padding-top: 10px;
        border-top: 1px solid #3c2b47;
        color: #f1d58b;
        font-weight: 900;
        font-size: 13px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 120;
        transform: translateX(-50%);
        background: #2e1c38;
        color: #fff;
        border: 1px solid #6d4b80;
        border-radius: 999px;
        padding: 10px 15px;
        font-weight: 850;
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.4);
        display: none;
      }
      .toast.show {
        display: block;
      }
      .print-only {
        display: none;
      }
      @media (max-width: 1120px) {
        .metrics {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .sat-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .promo-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 800px) {
        .topbar {
          padding: 12px 11px;

        async function loadMonthRows(from, to) {
          const cols = "*";
          const common = (q) =>
            q
              .is("eliminado_en", null)
              .order("fecha", { ascending: false })
              .limit(1000);
          const [a, b, c] = await Promise.all([
            common(
              sb
                .from("vip_finanzas_movimientos")
                .select(cols)
                .eq("tipo", "ingreso")
                .gte("fecha_cobro", from)
                .lt("fecha_cobro", to),
            ),
            common(
              sb
                .from("vip_finanzas_movimientos")
                .select(cols)
                .eq("tipo", "ingreso")
                .is("fecha_cobro", null)
                .gte("fecha", from)
                .lt("fecha", to),
            ),
            common(
              sb
                .from("vip_finanzas_movimientos")
                .select(cols)
                .eq("tipo", "egreso")
                .gte("fecha", from)
                .lt("fecha", to),
            ),
          ]);
          for (const r of [a, b, c]) if (r.error) throw r.error;
          const map = new Map();
          [...(a.data || []), ...(b.data || []), ...(c.data || [])].forEach(
            (x) => map.set(x.id, x),
          );
          return [...map.values()].sort((x, y) =>
            String(y.fecha_cobro || y.fecha).localeCompare(
              String(x.fecha_cobro || x.fecha),

        function drawPie3D() {
          const c = document.getElementById("financePie");
          if (!c) return;
          const ctx = c.getContext("2d"),
            dpr = Math.min(devicePixelRatio || 1, 2),
            rect = c.getBoundingClientRect(),
            w = Math.max(300, rect.width),
            h = Math.max(250, rect.height);
          c.width = w * dpr;
          c.height = h * dpr;
          ctx.scale(dpr, dpr);
          ctx.clearRect(0, 0, w, h);
          const seg = pieSegments(),
            total = seg.reduce((a, x) => a + x.value, 0),
            cx = w / 2,
            cy = h / 2 - 8,
            rx = Math.min(w * 0.34, 150),
            ry = rx * 0.68,
            depth = 18,
            hole = 0.48;
          if (!total) {
            ctx.strokeStyle = "#5d4669";
            ctx.lineWidth = 24;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.stroke();
            return;
          }
          const shade = (hex) => {
            const n = parseInt(hex.slice(1), 16),
              r = Math.max(0, (n >> 16) - 38),
              g = Math.max(0, ((n >> 8) & 255) - 38),
              b = Math.max(0, (n & 255) - 38);
            return `rgb(${r},${g},${b})`;
          };
          let start = -Math.PI / 2;
          for (let z = depth; z >= 1; z--) {
            let a = start;
            seg.forEach((s) => {
              const end = a + (Math.PI * 2 * s.value) / total;
              ctx.fillStyle = shade(s.color);
              ctx.beginPath();
              ctx.ellipse(cx, cy + z, rx, ry, 0, a, end);
              ctx.lineTo(cx, cy + z);
              ctx.closePath();
              ctx.fill();
              a = end;
            });
          }
          let a = start;
          seg.forEach((s) => {
            const end = a + (Math.PI * 2 * s.value) / total;
            const grd = ctx.createRadialGradient(
              cx - rx * 0.2,
              cy - ry * 0.35,
              10,
              cx,
              cy,
              rx,
            );
            grd.addColorStop(0, "#ffffff");
            grd.addColorStop(0.02, s.color);
            grd.addColorStop(1, shade(s.color));
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, a, end);
            ctx.lineTo(cx, cy);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgba(20,10,25,.65)";
            ctx.lineWidth = 2;
            ctx.stroke();
            a = end;
          });

          ctx.fillText(money(total), cx, cy + 20);
        }

        function taxCalc(total, paid, include, tasa, retIsr, retIva) {
          const effectively = Math.min(
              num(total),
              num(paid) + num(retIsr) + num(retIva),
            ),
            rate = num(tasa);
          if (rate <= 0) return { subtotal: effectively, iva: 0 };
          if (include) {
            const sub = effectively / (1 + rate / 100);
            return {
              subtotal: +sub.toFixed(2),
              iva: +(effectively - sub).toFixed(2),
            };
          }
          return {
            subtotal: effectively,
            iva: +((effectively * rate) / 100).toFixed(2),
          };
        }

                x: 0,
                y: 770,
                width: 612,
                height: 22,
                color: rgb(red, green, blue),
              });
              page.drawText(`MY Finanzas · pagina ${pageNumber}`, {
                x: margin,
                y: 778,
                size: 8,
                font: bold,
                color: rgb(1, 1, 1),
              });
            };
            const line = (text, options = {}) => {
              const font = options.bold ? bold : regular,
                size = options.size || 10,
                color = options.color || rgb(0.16, 0.1, 0.19),
                words = pdfSafeText(text).split(/\s+/),
                lines = [];
              let current = "";
              words.forEach((word) => {
                const next = current ? `${current} ${word}` : word;
                if (font.widthOfTextAtSize(next, size) > width && current) {
                  lines.push(current);
                  current = word;
                } else current = next;
              });
              if (current) lines.push(current);
              lines.forEach((part) => {
                if (y < 54) newPage();
                page.drawText(part, { x: margin, y, size, font, color });
                y -= options.gap || size + 4;
              });
              if (options.after) y -= options.after;
            };
            newPage();
            line(report.title, {
              bold: true,
              size: 18,
              color: rgb(red, green, blue),
              after: 4,
            });
            line(`Generado: ${report.generatedAt}`, { size: 9 });
            line(`${report.personType} · ${report.regime}`, {
              bold: true,
              size: 11,
              after: 8,
            });
            line(
              `Ingresos: ${money(report.income)}    Egresos: ${money(report.expenses)}`,
              { bold: true },
            );
            line(
              `Utilidad: ${money(report.result)}    Por cobrar: ${money(report.receivable)}`,
              { bold: true, after: 8 },
            );
            line("Organizador fiscal", {
              bold: true,
              size: 14,
              color: rgb(red, green, blue),
            });
            line(
              `Ingresos cobrados sin IVA: ${money(report.fs.incomeBeforeVat)}`,
            );
            line(`Tasa o apartado ISR: ${report.fs.rate.toFixed(2)}%`);
            line(`ISR preliminar: ${money(report.fs.isrEstimate)}`);
            line(
              `IVA trasladado: ${money(report.fs.vatTransferred)}    IVA acreditable: ${money(report.fs.vatCreditable)}`,
            );
            line(
              `Retenciones ISR: ${money(report.fs.withheldIsr)}    Retenciones IVA: ${money(report.fs.withheldVat)}`,
            );
            line(
              `Total preliminar para apartar: ${money(report.fs.totalReserve)}`,
              { bold: true, after: 10 },
            );
            line("Movimientos del mes", {
              bold: true,
              size: 14,
              color: rgb(red, green, blue),
            });
            if (!report.rows.length) line("Sin movimientos en este mes.");
            report.rows.forEach((item) => {
              const sign = item.tipo === "ingreso" ? "+" : "-";
              line(
                `${fmtDate(item.fecha_cobro || item.fecha)} | ${item.tipo === "ingreso" ? "Ingreso" : "Gasto"} | ${item.concepto || "Sin concepto"} | ${sign}${money(item.monto_pagado || item.monto_total)} | ${String(item.estado || "").replaceAll("_", " ")}`,
                { size: 8, gap: 11 },
              );
            });
            y -= 8;
            line(
              "Importante: este reporte es administrativo y presenta estimaciones preliminares. No sustituye una declaracion oficial del SAT ni la revision de tu contadora.",
              { size: 8, after: 3 },
            );
            const bytes = await doc.save();
            downloadBlob(
              new Blob([bytes], { type: "application/pdf" }),
              `administracion-finanzas-${state.month}.pdf`,
            );
            toast("Reporte PDF descargado");
          } catch (_) {
            toast("No pude generar el PDF. Intenta nuevamente.");
          }
        }
        function handleChange(e) {
          if (e.target.id === "monthFilter") {
            state.month = e.target.value || currentMonth();
            loadAll();
          }
          if (e.target.id === "archiveFilter") {
            state.showArchived = e.target.value === "si";
            render();
          }
        }
        function handleClick(e) {
          const b = e.target.closest("[data-action]");
          if (!b) return;
          const a = b.dataset.action;
          if (!actionAllowed(a)) {
            toast("Tu cuenta no tiene permiso para realizar esta acción.");
            return;
          }
          if (a === "current-month") {
            state.month = currentMonth();
            loadAll();
          } else if (a === "calculate-profitability") showProfitability();
          else if (a === "save-profitability") {
            const x=showProfitability();if(!(x.cost>0&&x.profit>0)){toast("Agrega costos y una ganancia positiva antes de guardar.");return;}const items=profitabilityItems();items.push({...x,id:"profit-"+Date.now()});localStorage.setItem(PROFITABILITY_KEY,JSON.stringify(items));render();toast("Cálculo guardado.");
          }
          else if (a === "delete-profitability") {
            localStorage.setItem(PROFITABILITY_KEY,JSON.stringify(profitabilityItems().filter(x=>x.id!==b.dataset.id)));render();toast("Cálculo eliminado.");
          }
          else if (a === "show-registration-example")
            openRegistrationExample();
          else if (a === "new-income") openMovement("income");
          else if (a === "new-service") openMovement("service");
          else if (a === "new-expense") openMovement("expense");
          else if (a === "edit-movement")
            openMovement(b.dataset.kind, b.dataset.id);
          else if (a === "sat-edit") openSatEdit(b.dataset.id);
          else if (a === "invoice") openInvoice(b.dataset.id);
          else if (a === "toggle-archive") toggleArchive(b.dataset.id);
          else if (a === "void") voidMovement(b.dataset.id);
          else if (a === "download-file") downloadPrivateFile(b.dataset.path);
          else if (a === "edit-fiscal-profile") openFiscalProfileEditor();
          else if (a === "export-month") exportMonth();
          else if (a === "export-word") exportWord();
          else if (a === "export-pdf") exportPdf();
          else if (a === "print") window.print();
          else if (a === "close-month") saveClosure("cerrado");
          else if (a === "archive-month") saveClosure("archivado");
          else if (a === "reopen-month") saveClosure("abierto");
          else if (a === "page") {
            state.pages[b.dataset.key] = Math.max(
              1,
              Number(b.dataset.page) || 1,
            );
            render();
          } else if (a === "back-control")
            document.getElementById("backBtn").click();
        }
        function toast(text) {
          const t = document.getElementById("toast");
          t.textContent = text;
          t.classList.add("show");
          clearTimeout(window.__financeToast);
          window.__financeToast = setTimeout(
            () => t.classList.remove("show"),
            2800,
          );
        }
        window.addEventListener("pageshow", (e) => {
          if (e.persisted) location.reload();
        });
        window.addEventListener(
          "resize",
          () => {
            if (state.tab === "resumen") drawPie3D();
          },
          { passive: true },
        );
        window.addEventListener("beforeunload", () => {
          if (realtimeChannel)
            try {
              sb.removeChannel(realtimeChannel);
            } catch (_) {}
        });
        boot();
      })();
    </script>
  </body>
</html>
