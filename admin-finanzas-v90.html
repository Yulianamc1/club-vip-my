async function boot(){try{if(!window.supabase?.createClient)throw new Error('No se pudo cargar la conexión segura.');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});await importTransferredSession();const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session){gateMessage('Primero inicia sesión','Abre la plataforma y entra con una cuenta autorizada desde el Centro de Control.');return}user=session.user;const {data:a,error:accessErr}=await sb.rpc('vip_equipo_mi_acceso');access=a||{};if(accessErr||!access.ok||!(access.rol==='duena'||access.permisos?.finanzas===true||access.permisos?.finanzas_ver===true)){gateMessage('Esta sección es privada','Solo pueden entrar la dueña y los subadministradores autorizados para Finanzas desde el Centro de Control.');return}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');bindShell();await loadAll();setupRealtime()}catch(err){gateMessage('No pude abrir la administración',friendlyError(err))}}
function bindShell(){document.getElementById('backBtn').onclick=()=>{const u=new URLSearchParams(location.search).get('vip_return');if(u)location.href=u;else if(history.length>1)history.back();else location.href='./'};document.getElementById('reloadBtn').onclick=loadAll;document.getElementById('modalX').onclick=closeModal;document.getElementById('modalCancel').onclick=closeModal;document.getElementById('modalSave').onclick=()=>modalSaveHandler&&modalSaveHandler();document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render()});document.getElementById('content').addEventListener('click',handleClick);document.getElementById('content').addEventListener('change',handleChange)}
async function loadConfig(){const {data,error}=await sb.rpc('obtener_config');if(error)throw error;const map={};(data||[]).forEach(r=>map[r.clave]=r.valor);plans=map.vip_planes&&typeof map.vip_planes==='object'?map.vip_planes:{};promotions=Array.isArray(map.vip_promociones)?map.vip_promociones:[];announcements=Array.isArray(map.vip_anuncios)?map.vip_anuncios:[];satCfg={regimen:'RESICO persona física',importesIncluyenIVA:true,tasaIVA:16,retencionISRPersonaMoral:1.25,retencionIVADefault:0,diaLimite:17,limiteAnual:3500000,...(map.vip_sat_config||{})}}
async function loadMonthRows(from,to){const cols='*';const common=q=>q.is('eliminado_en',null).order('fecha',{ascending:false}).limit(1000);const [a,b,c]=await Promise.all([common(sb.from('vip_finanzas_movimientos').select(cols).eq('tipo','ingreso').gte('fecha_cobro',from).lt('fecha_cobro',to)),common(sb.from('vip_finanzas_movimientos').select(cols).eq('tipo','ingreso').is('fecha_cobro',null).gte('fecha',from).lt('fecha',to)),common(sb.from('vip_finanzas_movimientos').select(cols).eq('tipo','egreso').gte('fecha',from).lt('fecha',to))]);for(const r of [a,b,c])if(r.error)throw r.error;const map=new Map();[...(a.data||[]),...(b.data||[]),...(c.data||[])].forEach(x=>map.set(x.id,x));return [...map.values()].sort((x,y)=>String(y.fecha_cobro||y.fecha).localeCompare(String(x.fecha_cobro||x.fecha)))}
async function loadAll(){setSync('Actualizando…',false);try{const {from,to}=bounds(state.month);await loadConfig();const [sumRes,rowsRes,closeRes,memberRes]=await Promise.all([sb.rpc('vip_finanzas_panel_mes',{p_desde:from,p_hasta:to}),loadMonthRows(from,to),sb.from('vip_finanzas_cierres').select('*').eq('periodo_mes',from).maybeSingle(),sb.from('miembros').select('id,nombre,correo,plan,estado,fecha_vencimiento').limit(5000)]);if(sumRes.error)throw sumRes.error;if(closeRes.error)throw closeRes.error;if(memberRes.error)throw memberRes.error;summary=sumRes.data||{};movements=rowsRes||[];closure=closeRes.data||null;members=memberRes.data||[];Object.keys(state.pages).forEach(k=>state.pages[k]=1);setSync('En tiempo real · datos actualizados',true);render()}catch(err){setSync('No se pudo actualizar',false);document.getElementById('content').innerHTML='<div class="errorbox"><b>No pude cargar los datos.</b><br>'+esc(friendlyError(err))+'</div>'}}
function setSync(text,ok){const e=document.getElementById('syncText');if(e)e.textContent=text;const d=document.querySelector('.dot');if(d)d.style.background=ok?'var(--green)':'var(--orange)'}
function alive(x){return !x.eliminado_en&&(state.showArchived||!x.archivado)&&x.estado!=='cancelado'}
function currentClosure(){return closure}function monthLocked(){return closure&&['cerrado','archivado'].includes(String(closure.estado||''))}
function filterBar(){return `<div class="filters no-print"><div class="field"><label>Mes que estás revisando</label><input id="monthFilter" type="month" value="${esc(state.month)}"><div class="help">Solo se carga este mes para mantener la sección ligera.</div></div><div class="field"><label>Registros archivados</label><select id="archiveFilter"><option value="no" ${!state.showArchived?'selected':''}>Ocultarlos</option><option value="si" ${state.showArchived?'selected':''}>También mostrarlos</option></select><div class="help">Archivar no borra información.</div></div><button class="btn" data-action="current-month">Ir al mes actual</button></div>`}
function metric(label,value,detail,cls='',tone=''){const k=label.toLowerCase(),icon=k.includes('sat')||k.includes('isr')||k.includes('iva')?'🏛️':k.includes('entró')||k.includes('ingreso')?'💰':k.includes('gast')?'🛍️':k.includes('quedó')||k.includes('resultado')?'✨':k.includes('deben')||k.includes('pendiente')?'⏳':'📌';return `<section class="card metric ${tone}"><div class="icon">${icon}</div><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div><small>${esc(detail)}</small></section>`}
function pageHead(title,desc,buttons=''){return `<div class="page-head"><div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div><div class="actions no-print">${buttons}</div></div>`}
function closureBadge(){const s=String(closure?.estado||'abierto');return `<span class="month-status ${s==='cerrado'?'closed':s==='archivado'?'archived':''}">${s==='cerrado'?'✓ Mes cerrado':s==='archivado'?'📦 Mes archivado':'● Mes abierto'}</span>`}
function planEntries(){return Object.entries(plans||{}).map(([key,p])=>({key,nombre:p?.nombre||key,precio:num(p?.precio),regalo:p?.regaloVisible!==false?(p?.regalo||''):'',regaloDesc:p?.regaloDesc||'',beneficios:Array.isArray(p?.beneficios)?p.beneficios:[]}))}
function activeMembers(){const t=today();return members.filter(m=>!/(venc|suspend|cancel|inactiv)/i.test(String(m.estado||'activo'))&&(!m.fecha_vencimiento||m.fecha_vencimiento>=t))}
function planStats(){const active=activeMembers(),counts=summary.planes_activos||{};const rows=planEntries();return `<div class="grid two"><section class="card soft-purple"><div class="section-title"><div><h3>Planes actuales del Centro de Control</h3><p>Nombres y precios leídos automáticamente de Supabase.</p></div></div>${rows.length?rows.map(p=>`<div class="plan-row"><div><b style="font-size:15px">${esc(p.nombre)}</b><div class="help">${p.regalo?'🎁 '+esc(p.regalo):'Sin regalo visible'}</div></div><div style="text-align:right"><b>${money(p.precio)}</b><div class="help">${Number(counts[p.key]??counts[p.nombre]??active.filter(x=>x.plan===p.key||x.plan===p.nombre).length)} activo(s)</div></div></div>`).join(''):'<div class="empty">No encontré planes configurados.</div>'}</section><section class="card soft-gold"><div class="section-title"><div><h3>Automatización activa</h3><p>Lo que cambies en el Centro de Control se refleja aquí.</p></div></div><div class="plan-row"><span>Planes sincronizados</span><b>${rows.length}</b></div><div class="plan-row"><span>Promociones configuradas</span><b>${promotions.length}</b></div><div class="plan-row"><span>Regalos visibles en planes</span><b>${rows.filter(x=>x.regalo).length}</b></div><div class="plan-row"><span>Miembros activos</span><b>${active.length}</b></div><div class="note" style="margin-top:12px"><b>Automático:</b> al agregar o editar una persona en Miembros, su plan y estado cambian aquí en tiempo real. Solo se registra como ingreso cuando el pago queda aprobado, para no contar accesos gratuitos o pagos pendientes como dinero cobrado.<br><br>Los pagos anteriores conservan el importe y nombre realmente cobrados; cambiar un plan hoy no modifica el historial.</div></section></div>`}
function pieSegments(){const s=summary;return[{name:'Suscripciones',value:num(s.suscripciones),color:'#9a5cbd'},{name:'Ingresos extra',value:Math.max(0,num(s.ingresos_adicionales)),color:'#e6bf62'},{name:'Gastos',value:num(s.egresos),color:'#e77777'},{name:'Lo que quedó',value:Math.max(0,num(s.utilidad)),color:'#61c895'}].filter(x=>x.value>0)}
function chartSection(){const seg=pieSegments(),total=seg.reduce((a,x)=>a+x.value,0);return `<section class="card chart-card"><div class="chart-wrap"><canvas id="financePie" width="520" height="360" aria-label="Gráfica de pastel financiera"></canvas></div><div><div class="section-title"><div><h3>Distribución del mes</h3><p>Gráfica ligera con efecto de profundidad; no usa tecnología 3D pesada.</p></div></div><div class="legend">${seg.length?seg.map(x=>`<div class="legend-row"><i class="legend-dot" style="background:${x.color}"></i><div><b>${esc(x.name)}</b><br><small>${total?((x.value/total)*100).toFixed(1):0}% del conjunto mostrado</small></div><b>${money(x.value)}</b></div>`).join(''):'<div class="empty">Registra movimientos para ver la gráfica.</div>'}</div></div></section>`}
function drawPie3D(){const c=document.getElementById('financePie');if(!c)return;const ctx=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),rect=c.getBoundingClientRect(),w=Math.max(300,rect.width),h=Math.max(250,rect.height);c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const seg=pieSegments(),total=seg.reduce((a,x)=>a+x.value,0),cx=w/2,cy=h/2-8,rx=Math.min(w*.34,150),ry=rx*.68,depth=18,hole=.48;if(!total){ctx.strokeStyle='#5d4669';ctx.lineWidth=24;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();return}const shade=hex=>{const n=parseInt(hex.slice(1),16),r=Math.max(0,(n>>16)-38),g=Math.max(0,((n>>8)&255)-38),b=Math.max(0,(n&255)-38);return `rgb(${r},${g},${b})`};let start=-Math.PI/2;for(let z=depth;z>=1;z--){let a=start;seg.forEach(s=>{const end=a+Math.PI*2*s.value/total;ctx.fillStyle=shade(s.color);ctx.beginPath();ctx.ellipse(cx,cy+z,rx,ry,0,a,end);ctx.lineTo(cx,cy+z);ctx.closePath();ctx.fill();a=end})}let a=start;seg.forEach(s=>{const end=a+Math.PI*2*s.value/total;const grd=ctx.createRadialGradient(cx-rx*.2,cy-ry*.35,10,cx,cy,rx);grd.addColorStop(0,'#ffffff');grd.addColorStop(.02,s.color);grd.addColorStop(1,shade(s.color));ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,a,end);ctx.lineTo(cx,cy);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(20,10,25,.65)';ctx.lineWidth=2;ctx.stroke();a=end});ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.ellipse(cx,cy,rx*hole,ry*hole,0,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#1d1424';ctx.beginPath();ctx.ellipse(cx,cy+3,rx*hole,ry*hole,0,0,Math.PI*2);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#f6e6b3';ctx.font='800 15px system-ui';ctx.fillText('Movimiento',cx,cy-2);ctx.font='900 19px system-ui';ctx.fillText(money(total),cx,cy+20)}
function renderSummary(){const s=summary;return pageHead('Resumen de '+monthName(state.month),'Información automática, visual y preparada para tus cuentas.',`<button class="btn primary" data-action="new-income">+ Ingreso</button><button class="btn" data-action="new-service">+ Trabajo privado</button><button class="btn" data-action="new-expense">+ Gasto</button>`)+filterBar()+`<section class="quick-zone"><div class="quick-title"><h3>Registro rápido y automático</h3><p>Planes, precios, promociones y regalos se leen desde el Centro de Control.</p></div><div class="quick-actions"><button class="quick-card" data-action="new-income"><span class="qicon">💰</span><b>Ingreso extra</b><small>Venta, plantilla, producto o curso.</small></button><button class="quick-card" data-action="new-service"><span class="qicon">🤝</span><b>Trabajo privado</b><small>Anticipo, saldo, entrega y SAT.</small></button><button class="quick-card" data-action="new-expense"><span class="qicon">💳</span><b>Gasto</b><small>Factura, IVA y categoría.</small></button><button class="quick-card" data-action="export-month"><span class="qicon">📥</span><b>Descargar mes</b><small>Excel cargado solo al solicitarlo.</small></button></div></section><div class="grid metrics">${metric('Dinero que entró',money(s.ingresos),'Cobros del mes, incluido IVA cuando corresponde.','green','soft-green')}${metric('Dinero que gasté',money(s.egresos),'Gastos pagados del mes.','red')}${metric('Lo que quedó',money(s.utilidad),'Ingresos menos gastos.',num(s.utilidad)>=0?'green':'red','soft-purple')}${metric('Lo que me deben',money(s.pendiente_cobro),'Saldos pendientes del mes.','orange')}${metric('Apartar para SAT',money(s.total_apartar_sat),'Estimación de ISR RESICO e IVA.','goldtext','soft-gold')}</div><div style="height:12px"></div>${chartSection()}<div style="height:12px"></div>${planStats()}<div style="height:12px"></div><div class="note"><b>Estado del mes:</b> ${closureBadge()} ${monthLocked()?'Reábrelo para registrar cambios.':'Puedes seguir registrando movimientos.'}</div>`}
function statusBadge(s){s=String(s||'').toLowerCase();const cls=/pagado|complet|recibida|emitida|revisado|declarado/.test(s)?'ok':/pend|parcial|por_/.test(s)?'warn':/cancel|anul/.test(s)?'bad':'';return `<span class="badge ${cls}">${esc(s.replaceAll('_',' ')||'sin estado')}</span>`}
function paginated(rows,key){const size=state.pageSize,totalPages=Math.max(1,Math.ceil(rows.length/size)),page=Math.min(state.pages[key]||1,totalPages);state.pages[key]=page;return{rows:rows.slice((page-1)*size,page*size),page,totalPages,total:rows.length}}
function pagination(key,p){if(p.totalPages<=1)return'';return `<div class="pagination"><span>${p.total} registros · página ${p.page} de ${p.totalPages}</span><div class="actions"><button class="btn small" data-action="page" data-key="${key}" data-page="${p.page-1}" ${p.page<=1?'disabled':''}>← Anterior</button><button class="btn small" data-action="page" data-key="${key}" data-page="${p.page+1}" ${p.page>=p.totalPages?'disabled':''}>Siguiente →</button></div></div>`}
function movementTable(rows,kind){const p=paginated(rows,kind==='income'?'ingresos':kind==='service'?'servicios':'gastos');if(!p.rows.length)return '<div class="empty card">✨ Todavía no hay registros para este mes.</div>';return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th><th>Cliente / proveedor</th><th>Total</th><th>Cobrado / pagado</th><th>Descuento</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${p.rows.map(x=>`<tr><td>${fmtDate(x.fecha_cobro||x.fecha)}</td><td>${esc(x.categoria||'')}</td><td><b>${esc(x.concepto||'')}</b>${x.promocion_nombre?`<br><span class="badge gold">🎉 ${esc(x.promocion_nombre)}</span>`:''}${x.regalo_nombre?`<br><span class="badge gold">🎁 ${esc(x.regalo_nombre)}</span>`:''}</td><td>${esc(x.cliente_proveedor||'')}</td><td>${money(x.monto_total)}</td><td>${money(x.monto_pagado)}</td><td>${money(x.monto_descuento)}</td><td>${statusBadge(x.estado)}${x.archivado?'<br><span class="badge">archivado</span>':''}</td><td><div class="row-actions"><button class="btn small" data-action="edit-movement" data-id="${x.id}" data-kind="${kind}">Editar</button>${x.tipo==='ingreso'?`<button class="btn small" data-action="sat-edit" data-id="${x.id}">SAT</button>`:''}<button class="btn small" data-action="toggle-archive" data-id="${x.id}">${x.archivado?'Restaurar':'Archivar'}</button>${x.estado!=='cancelado'?`<button class="btn danger small" data-action="void" data-id="${x.id}">Anular</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>${pagination(kind==='income'?'ingresos':kind==='service'?'servicios':'gastos',p)}`}
function renderIncome(){const rows=movements.filter(x=>alive(x)&&x.tipo==='ingreso'&&x.origen!=='servicio_privado');return pageHead('Ingresos y ventas','Incluye suscripciones automáticas, productos, plantillas y otros ingresos.',`<button class="btn primary" data-action="new-income">+ Registrar ingreso</button>`)+filterBar()+movementTable(rows,'income')}
function renderServices(){const rows=movements.filter(x=>alive(x)&&x.tipo==='ingreso'&&x.origen==='servicio_privado');return pageHead('Trabajos privados','Diseños, asesorías, campañas y planes de contenido con anticipo, saldo y datos SAT.',`<button class="btn primary" data-action="new-service">+ Registrar trabajo</button>`)+filterBar()+movementTable(rows,'service')}
function renderExpenses(){const rows=movements.filter(x=>alive(x)&&x.tipo==='egreso');return pageHead('Gastos del negocio','Publicidad, plataformas, materiales, comisiones, equipo y servicios.',`<button class="btn primary" data-action="new-expense">+ Registrar gasto</button>`)+filterBar()+movementTable(rows,'expense')}
function renderInvoices(){const rows=movements.filter(x=>alive(x)&&x.tipo==='egreso'),p=paginated(rows,'facturas');return pageHead('Facturas recibidas','Organiza UUID, subtotal, IVA, total y archivos XML/PDF de tus gastos.')+filterBar()+(p.rows.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Proveedor</th><th>Concepto</th><th>Estado</th><th>UUID</th><th>Subtotal</th><th>IVA</th><th>Total</th><th>Archivos</th><th>Acciones</th></tr></thead><tbody>${p.rows.map(x=>`<tr><td>${fmtDate(x.fecha)}</td><td>${esc(x.cliente_proveedor||'')}</td><td><b>${esc(x.concepto||'')}</b></td><td>${statusBadge(x.factura_estado)}</td><td>${esc(x.factura_uuid||'')}</td><td>${money(x.factura_subtotal)}</td><td>${money(x.factura_iva)}</td><td>${money(x.factura_total)}</td><td><div class="row-actions">${x.factura_xml_path?`<button class="btn small" data-action="download-file" data-path="${esc(x.factura_xml_path)}">XML</button>`:''}${x.factura_pdf_path?`<button class="btn small" data-action="download-file" data-path="${esc(x.factura_pdf_path)}">PDF</button>`:''}</div></td><td><button class="btn small" data-action="invoice" data-id="${x.id}">Editar factura</button></td></tr>`).join('')}</tbody></table></div>${pagination('facturas',p)}`:'<div class="empty card">No hay gastos en este mes.</div>')}
function promoStatus(p){const t=today(),active=p.activo!==false&&(!p.fechaInicio||p.fechaInicio<=t)&&(!p.fechaFin||p.fechaFin>=t);return active?'<span class="badge ok">Activa</span>':'<span class="badge">Inactiva</span>'}
